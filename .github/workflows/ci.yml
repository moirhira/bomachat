name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]


jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest
  
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential make netcat

    - name: compile
      run:  make -C src all

    - name: Binary exists check
      run: test -f ./bomachat && echo "✅ Binary found" || (echo "❌ Binary missing" && exit 1)

      