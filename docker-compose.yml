services:
  bomachat:
    build: .
    container_name: bomachat
    ports:
      - "${BOMA_PORT:-6667}:${BOMA_PORT:-6667}"
      - "9101:9101"
    environment:
      - BOMA_PORT=${BOMA_PORT:-6667}
      - BOMA_PASSWORD=${BOMA_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo PING | nc -w1 localhost ${BOMA_PORT:-6667} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  
  