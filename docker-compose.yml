services:
  bomachat:
    build: .
    container_name: bomachat
    ports:
      - "${BOMA_PORT:-6667}:${BOMA_PORT:-6667}"
      - "9101:9101"
    environment:
      - BOMA_PORT=${BOMA_PORT:-6667}
      - BOMA_PASSWORD=${BOMA_PASSWORD:-changeme}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "echo PING | nc -w1 localhost ${BOMA_PORT:-6667} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - bomachat
    network:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped
    network:
      - monitoring





networks:
  monitoring:
  
  